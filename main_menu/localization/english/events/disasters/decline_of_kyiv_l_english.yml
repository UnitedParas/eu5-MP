l_english:
decline_of_kyiv: "Decline of Kyiv"
decline_of_kyiv_desc: "A hundred years after the Siege of Kiev, the [GetCountry('KIE').GetLongName] has only declined. A Gediminaitis prince sits on the throne, subservient to the Grand Duchy. However, the Tatars still demand tribute from the principality. [GetCountry('KIE').GetGovernment.GetRuler.GetName] must navigate between the two dominating powers, or risk being fully taken over."
decline_of_kyiv_lithuanian_influence_tt: "Reaching a 100 points in $kie_lithuanian_influence_var$, will put us under Lithuanian control."
decline_of_kyiv_mongol_influence_tt: "Reaching a 100 points in $kie_mongol_influence_var$, will put us under Tatar control."
decline_of_kyiv_rurikovich_influence_tt: "Reaching 100 points in $kie_rurikovich_influence_var$, will put us under Rurikovich control."
kie_lithuanian_influence_var: "#Y Lithuanian Influence#!"
kie_mongol_influence_var: "#Y Mongol Influence#!"
kie_rurikovich_influence_var: "#Y Rurikovich Influence#!"
kie_lithuanian_variable_counter: "#Y [GetCountry('KIE').MakeScope.GetVariable('kie_lithuanian_influence_var').GetValue]#!"
kie_mongol_variable_counter: "#Y [GetCountry('KIE').MakeScope.GetVariable('kie_mongol_influence_var').GetValue]#!"
placate_the_lithuanians: "Placate the $LIT_ADJ$s"
placate_the_lithuanians_desc: "The growing power of the [GetCountry('LIT').GetLongName] cannot be ignored. By gifting gold and concessions to the Lithuanian court we may temper its ambitions against Kyiv and buy more time to strength our nation."
placate_the_lithuanians_tt: "The [GetCountry('LIT').GetLongName] will receive gold and prestige in exhange for favor and influence"
placate_the_mongols: "Placate the $GLH_ADJ$s"
placate_the_mongols_desc: "Though the authority of the [GetCountry('GLH').GetLongName] weighs heavily on Kyiv, the favor of the Khan may buy us respite. By sending tribute and reaffirming our status under the Horde, we may secure peace from Mongol interference."
placate_the_mongols_tt: "The [GetCountry('GLH').GetLongName] will receive gold and prestige in exhange for safety from Mongol raids"
placate_the_rurikovichs: "Placate the Rurikovichs"
placate_the_rurikovichs_desc: "The princes of the [GetDynasty('rurikovich_dynasty').GetName] line have not forgotten Kyiv. By recognizing their dynastic interests and cultivating ties with our distant kinsmen, we may satisfy their ambitions without submitting entirely." 
placate_the_rurikovichs_tt: "The [GetDynasty('rurikovich_dynasty').GetName] will receive gold and prestige in exhange for favor and influence"
strengthen_local_administration: "Strengthen Local Administration"
strengthen_local_administration_desc: "Decades of foreign domination and political fragmentation have weakened the authority of the Kyivan princes throughout their own lands. By investing in local officials and restoring government institutions, we may temporarily strengthen our control over the principality."

emergency_tax_collection: "Emergency Tax Collection"
emergency_tax_collection_desc: "Kyiv's weakened administration has left much of the wealth of the Principality beyond the reach of the princely treasury. Extraordinary collections of local revenues could restore some of this lost income, though such measures cannot be maintained indefinitely."


decline_of_kyiv.1.title: "The Decline of Kyiv"
decline_of_kyiv.1.desc_a: "[ShowLocationName('kyiv')] was once the trade and political center of the Rus world. However, a century of Mongol invasion and rule has left the once-great city in ruins. Now a destitute capital of a crumbling [ROOT.GetCountry.GetFlavorRank], [GetCountry('KIE').GetGovernment.GetRuler.GetName] must navigate the domineering powers of [GetCountry('LIT').GetName] and [GetCountry('GLH').GetName], and the upstart [GetCountry('MOS').GetLongName] attempting to secure its hold over the former Rus."
decline_of_kyiv.1.desc_b: "The [GetCountry('KIE').GetLongName] has long been declining. Now, with a foreign prince on the throne their instability has reached a breaking point. With its strength over the other Rus diminishing and its title of Grand Prince stripped, it is our time to claim the [ROOT.GetCountry.GetFlavorRank] for ourselves."
decline_of_kyiv.1.a: "Our dark age has arrived."
decline_of_kyiv.1.b: "[GetCountry('KIE').GetName] will belong to us."