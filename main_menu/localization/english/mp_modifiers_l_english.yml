l_english:
STATIC_MODIFIER_NAME_strait_of_dover: "Control over the Strait of Dover"
STATIC_MODIFIER_DESC_strait_of_dover: "The Strait of Dover is a crucial chokepoint for trade between the North Sea and the English Channel. Controlling this area allows for significant influence over maritime trade routes, enabling the collection of tolls and the regulation of shipping traffic."

STATIC_MODIFIER_NAME_pillars_of_hercules: "Pillars of Hercules"
STATIC_MODIFIER_DESC_pillars_of_hercules: "The Strait of Gibraltar, known as the Pillars of Hercules in ancient times, serves as a vital gateway between the Atlantic Ocean and the Mediterranean Sea. Dominating this chokepoint provides strategic control over naval passage and trade, allowing for the imposition of tariffs and the management of maritime commerce."

STATIC_MODIFIER_NAME_gateway_of_the_persian_gulf: "Gateway to the Persian Gulf"
STATIC_MODIFIER_DESC_gateway_of_the_persian_gulf: "The Strait of Hormuz is a critical maritime passage connecting the Persian Gulf to the Arabian Sea and beyond. Control over this chokepoint is essential for regulating the flow of oil and other goods, granting significant leverage in international trade and energy markets."

STATIC_MODIFIER_NAME_crossroads_of_the_indies: "Crossroads of the Indies"
STATIC_MODIFIER_DESC_crossroads_of_the_indies: "The Malacca Strait is one of the busiest shipping lanes in the world, linking the Indian Ocean with the South China Sea. Dominating this chokepoint allows for the regulation of trade between Southeast Asia and the rest of the world, providing opportunities for economic influence and the collection of tolls from passing vessels."

STATIC_MODIFIER_NAME_the_bosphorus_and_the_dardanelles: "The Bosporus and Dardanelles"
STATIC_MODIFIER_DESC_the_bosphorus_and_the_dardanelles: "The Bosporus and Dardanelles straits are strategic chokepoints connecting the Black Sea to the Mediterranean. Control over these waterways enables the regulation of trade and military movement, offering significant advantages in both commerce and defense for any power that holds sway over them."

STATIC_MODIFIER_NAME_gate_of_the_red_sea: "Gate of the Red Sea"
STATIC_MODIFIER_DESC_gate_of_the_red_sea: "The Bab el-Mandeb strait is a crucial maritime passage connecting the Red Sea to the Gulf of Aden and the Arabian Sea. Controlling this chokepoint allows for the regulation of shipping traffic and trade routes, providing strategic leverage in regional commerce and security."

STATIC_MODIFIER_NAME_the_sound: "The Øresund Strait"
STATIC_MODIFIER_DESC_the_sound: "The Øresund Strait, located between Denmark and Sweden, is a vital chokepoint for maritime trade in Northern Europe. Control over this strait allows for the regulation of shipping traffic between the North Sea and the Baltic Sea, offering economic and strategic advantages to any power that dominates this passage."

STATIC_MODIFIER_NAME_recovery_from_the_mongols: "Recovery from the Mongols"
STATIC_MODIFIER_DESC_recovery_from_the_mongols: "After a century of Mongol destruction, the lands of Persia are beginning to heal."

STATIC_MODIFIER_NAME_langarud_base: "Seta Ghella Silk"
STATIC_MODIFIER_DESC_langarud_base: "Abundant in silk worms, Gilan became famous for its silk production."

