l_english:

 # === Variable Tooltips ===
 nd_alm_formed_tt: "Almohad Caliphate formed"
 nd_alm_path_a_tt: "Path of the Mu'minun chosen"
 nd_alm_path_b_tt: "Path of the Caliphal court chosen"

 # === Advances ===
 nd_alm_tinmel_foundation: "The Tinmel Foundation"
 nd_alm_tinmel_foundation_desc: "Ibn Tumart's mountain madrasa at Tinmel, in the Sus valley of the High Atlas, was the cradle of the Almohad movement. Here he proclaimed the Mahdiyya, taught the doctrine of divine unity (tawhid), and gathered the Masmuda tribes that would become the army of Abd al-Mu'min."
 nd_alm_masmuda_infantry: "Masmuda Infantry"
 nd_alm_masmuda_infantry_desc: "Unlike the Almoravids who drew on Saharan camel cavalry, the Almohad army was built around the dense infantry formations of the semi-nomadic Masmuda Berbers of the High Atlas: spearmen and javelin throwers organized by tribal hierarchy."
 nd_alm_zenata_horsemen: "Zenata Horsemen"
 nd_alm_zenata_horsemen_desc: "The Zenata Berbers of the high plateau provided the light cavalry of the Maghrebi armies: skirmishers and lancers who fought with the karr wa farr tactic of attack and feigned retreat, mounted on the swift North African horse."
 nd_alm_kasbah_tradition: "Kasbah Tradition"
 nd_alm_kasbah_tradition_desc: "Almohad governors ruled their cities from the kasbah, a fortified citadel rising above the medina with its own walls, gates, granaries, and barracks. Marrakesh, Fez, Sevilla and Rabat all received Almohad kasbahs."
 nd_alm_council_of_ten: "Council of Ten"
 nd_alm_council_of_ten_desc: "The Almohad state was governed by a hierarchy of councils descending from the Caliph: the Ahl al-dar (Council of Ten) of close kinsmen and trusted shaykhs, then the Council of Fifty, and below it the assemblies of the Masmuda tribes. This stratified council government bound the regime tightly to its Berber base."

 nd_alm_minaret_tradition: "Almohad Minaret Tradition"
 nd_alm_minaret_tradition_desc: "The square sandstone minaret of the Koutoubia in Marrakesh, copied at the Hassan Tower in Rabat and the Giralda in Sevilla, became the signature of Almohad religious architecture: monumental, austere, and visible across half the kingdom."
 nd_alm_falsafa: "Falsafa"
 nd_alm_falsafa_desc: "The Almohad Caliphs, Abu Yaqub Yusuf and Yaqub al-Mansur in particular, gathered around themselves the philosophers of al-Andalus: Ibn Tufayl, Ibn Rushd (Averroes), and the Jewish thinker Maimonides. Their Marrakesh court became the high point of medieval Aristotelian commentary."
 nd_alm_andalusi_crossbow: "Andalusi Crossbowmen"
 nd_alm_andalusi_crossbow_desc: "The cities of al-Andalus furnished the Caliphate with its missile infantry: townsmen trained on the foot crossbow, descendants of the Cordoban tradition, who supplemented the Berber spear with the steel-tipped bolt."
 nd_alm_caravan_economy: "Caravan Economy"
 nd_alm_caravan_economy_desc: "Sijilmasa and Wadan stood at the desert end of the trans-Saharan trade. Almohad governors built funduqs in the cities, organized caravan routes, and taxed the gold-and-salt traffic that bound the Sahel to the Mediterranean."
 nd_alm_maliki_revival: "Maliki Revival"
 nd_alm_maliki_revival_desc: "Although Ibn Tumart and the early Caliphs persecuted the Maliki fuqaha and burned copies of the Muwatta, by the reign of al-Mansur the older school had quietly reasserted itself. The fiqh of the qadis returned to Maliki precedent, anchoring the regime in the inherited jurisprudence of the Maghreb."

 nd_alm_jihad_andalus: "Jihad in al-Andalus"
 nd_alm_jihad_andalus_desc: "Each Caliph in turn crossed the strait at the head of a great army to wage jihad against the Christian kingdoms: at Alarcos in 1195, Yaqub al-Mansur shattered Castile, and the green-and-white standards reached as far as Toledo. The Almohad campaigns set the model for the long Iberian war."
 nd_alm_christian_mercenaries: "Christian Mercenary Brigades"
 nd_alm_christian_mercenaries_desc: "By the late twelfth century the Almohads, like the Andalusi taifa kings before them, had begun to recruit Iberian Christian mercenaries by the thousand: Castilian knights serving in the Caliph's guard, Norman foot soldiers garrisoning provincial towns, paid in silver and given houses in Marrakesh."
 nd_alm_ribat_tradition: "Ribat Tradition"
 nd_alm_ribat_tradition_desc: "The ribat was a fortified frontier monastery where lay volunteers performed military service alongside their devotions. Strung along the coast from Sale to Sus to Sfax, the ribats trained the murabitun: pious frontiersmen who answered the Caliph's call."
 nd_alm_marrakeshi_metalwork: "Marrakeshi Metalwork"
 nd_alm_marrakeshi_metalwork_desc: "The forges of the Almohad capital armed both the Berber jund and the Andalusi infantry, with Damascene-style steel from Iberian iron and brass-fitted scimitars copied from the eastern lands. The Caliphal armouries set the standard for the western Mediterranean."
 nd_alm_maghrebi_astronomy: "Maghrebi Astronomy"
 nd_alm_maghrebi_astronomy_desc: "The Andalusi astronomers Ibn Tufayl, al-Bitruji, and Jabir ibn Aflah worked at the Almohad court, refining the Ptolemaic system, building observatories, and producing the astronomical tables that would later feed Toledo and Paris."

 nd_alm_monumental_caliphate: "The Monumental Caliphate"
 nd_alm_monumental_caliphate_desc: "Yaqub al-Mansur made monumental architecture an instrument of legitimacy. Ribat al-Fath, the Hassan Tower, the great mosque at Sevilla with its Giralda, the Koutoubia in Marrakesh: across the Caliphate, the Almohad name was raised in stone, austere and immense."
 nd_alm_andalusi_silk: "Andalusi Silk Weaving"
 nd_alm_andalusi_silk_desc: "From Almeria to Granada, the silk workshops of al-Andalus, inheritors of the Cordoban tradition, wove the finest textiles in the western Mediterranean. The Caliph's tiraz workshops produced the embroidered robes of state worn from Marrakesh to Cairo."
 nd_alm_sufi_brotherhoods: "Sufi Brotherhoods"
 nd_alm_sufi_brotherhoods_desc: "Spreading from the zawiyas of the Maghreb, popular Sufi orders, the Shadhili and Qadiri among them, took root in city and village alike. Their saints (awliya) and spiritual genealogies bound peripheral peoples to the urban Islamic culture and assimilated newcomers to the Caliphal orthodoxy."
 nd_alm_caliphal_arsenals: "Caliphal Arsenals"
 nd_alm_caliphal_arsenals_desc: "Imperial arsenals at Marrakesh, Fez, and Sevilla supplied the Caliph's standing forces: jund cavalry, Andalusi infantry, and the imperial bodyguard. Centralized armament made it possible to field the largest armies in the western Islamic world."
 nd_alm_saharan_gold: "Trans-Saharan Gold"
 nd_alm_saharan_gold_desc: "The gold of the Wadi Sus and the salt of Taghaza moved through Almohad customs houses on its way to Mediterranean markets. The Caliphate's tax revenues swelled in proportion to the trans-Saharan flow."

 nd_alm_sharifian_legitimacy: "Sharifian Legitimacy"
 nd_alm_sharifian_legitimacy_desc: "The descendants of the Almohad Caliphs and the later Maghrebi dynasties claimed sharifian descent from the Prophet, lending their rule a legitimacy independent of the Abbasid caliphate or any external authority."
 nd_alm_maghrebi_corsairs: "Maghrebi Corsairs"
 nd_alm_maghrebi_corsairs_desc: "From Sale to Tetouan to Algiers, the corsair ports of the Maghreb sent fast xebecs and galleots into the western Mediterranean and the Atlantic, raiding European shipping and bringing slaves and silver back to the Caliphate."
 nd_alm_kharaj_reform: "Kharaj Reform"
 nd_alm_kharaj_reform_desc: "Reformed land taxation distinguished kharaj on conquered estates from ushr tithes on Muslim freeholds, regularizing the fiscal foundation of the Caliphate and stabilizing revenue across rural areas."
 nd_alm_mobile_court: "The Mahalla"
 nd_alm_mobile_court_desc: "The Caliph governed from a mobile encampment, the mahalla, that moved between Marrakesh, Fez, and the provinces. This itinerant rulership kept rebellious tribes in check and reasserted central authority by direct presence."

 nd_alm_modernization: "Caliphal Modernization"
 nd_alm_modernization_desc: "Following the example of the Ottoman nizam-i-cedid and the Egyptian reforms of Muhammad Ali, the Caliphate's officers drilled regular infantry in European fashion, importing instructors and modern muskets to face the new age of warfare."
 nd_alm_anti_colonial_resistance: "Anti-Colonial Resistance"
 nd_alm_anti_colonial_resistance_desc: "Where Algiers fell and Tunis became a protectorate, the Caliphate stood against European encroachment: diplomatic plays in the European courts, supply of irregular forces in the hinterland, and the doctrine that the Maghreb was not for sale."
 nd_alm_industrial_revival: "Industrial Revival"
 nd_alm_industrial_revival_desc: "Modern arsenals at Casablanca, shipyards at Sale, and printed schoolbooks in Fez signal the Caliphate's late embrace of industrial technique, an attempt to meet European powers as a peer rather than as a subject."
 nd_alm_maghrebi_press: "Maghrebi Printing Press"
 nd_alm_maghrebi_press_desc: "Late but determined, Arabic printing presses at Fez and Marrakesh produce schoolbooks, gazettes, and translated European works. Print culture penetrates the urban literate classes and reshapes the public sphere."

 # === Buildings ===
 nd_alm_kasbah_citadel: "Almohad Kasbah"
 nd_alm_kasbah_citadel_desc: "A fortified citadel built atop the city, with its own walls, granary, barracks, and the governor's palace. The Almohad kasbah projects imperial authority into every Maghrebi city."
 nd_alm_almohad_minaret: "Almohad Minaret"
 nd_alm_almohad_minaret_desc: "A vast square minaret in the Almohad style, of dressed sandstone with sebka panels and arched balcony: the model for the Koutoubia, Hassan Tower, and Giralda."
 nd_alm_house_of_wisdom: "House of Wisdom"
 nd_alm_house_of_wisdom_desc: "A scholarly institution combining madrasa, library, and translation bureau. Andalusi philosophers, Jewish physicians, and Maghrebi astronomers all serve under the Caliph's patronage."
 nd_alm_funduq_quarter: "Funduq Quarter"
 nd_alm_funduq_quarter_desc: "An urban district of caravanserais, warehouses, and merchant houses where trans-Saharan caravans terminate and Mediterranean shipping is unloaded. The funduq is the engine of Maghrebi urban wealth."
 nd_alm_coastal_ribat: "Coastal Ribat"
 nd_alm_coastal_ribat_desc: "A fortified frontier monastery on the coast, where lay volunteers do military service alongside their devotions. The ribats line the Atlantic and Mediterranean shores from Sale to Sfax."
 nd_alm_caliphal_armoury: "Caliphal Armoury"
 nd_alm_caliphal_armoury_desc: "An imperial arms workshop producing weaponry for the jund and the Andalusi infantry, equipped with forges, foundries, and the corps of armourers attached to the Caliph's standing forces."
 nd_alm_andalusi_silk_workshop: "Andalusi Silk Workshop"
 nd_alm_andalusi_silk_workshop_desc: "A tiraz workshop in the al-Andalus tradition, weaving the finest brocade and embroidered robes of state, exported from Almeria and Granada to all the courts of the Mediterranean."
 nd_alm_caliphal_academy: "Caliphal Academy"
 nd_alm_caliphal_academy_desc: "A modern military and scientific academy on the Ottoman nizam-i-cedid model, teaching artillery, fortification, geometry, and modern languages to a new generation of officers and bureaucrats."
 nd_alm_diwan_al_jund: "Diwan al-Jund"
 nd_alm_diwan_al_jund_desc: "The imperial muster office, barracks, and pay office for the standing army. The Caliph's standing forces, the jund, are paid and equipped from this institution rather than levied from estates."
 nd_alm_diwan_upkeep: "Diwan Upkeep"
 nd_alm_diwan_upkeep_desc: "Pay and provisions for the standing soldiery, weapons from the armouries, and the regiments' rations."

 # === Production Methods ===
 nd_alm_kasbah_upkeep: "Kasbah Upkeep"
 nd_alm_kasbah_upkeep_desc: "Stone walls, weapons, and the Caliphal garrison's daily provisions."
 nd_alm_minaret_upkeep: "Minaret Upkeep"
 nd_alm_minaret_upkeep_desc: "Stonework, lime mortar, and the wax candles that light the prayer hall."
 nd_alm_house_of_wisdom_upkeep: "House of Wisdom Upkeep"
 nd_alm_house_of_wisdom_upkeep_desc: "Paper from Fez and Jativa, books bound in tooled leather, and the modest needs of resident scholars."
 nd_alm_funduq_upkeep: "Funduq Upkeep"
 nd_alm_funduq_upkeep_desc: "Fodder, food, and storage for the caravans of merchants and their pack animals."
 nd_alm_ribat_upkeep: "Ribat Upkeep"
 nd_alm_ribat_upkeep_desc: "Stonework for walls, weapons for the murabitun, and naval supplies for the coastal lookout."
 nd_alm_armoury_upkeep: "Armoury Upkeep"
 nd_alm_armoury_upkeep_desc: "Iron, charcoal, and the toolmakers' gear that keep the forges running."
 nd_alm_armoury_workshop: "Caliphal Armoury Workshop"
 nd_alm_armoury_workshop_desc: "Iron and coal worked into the steel-tipped weapons of the jund and the Andalusi infantry."
 nd_alm_silk_workshop_upkeep: "Silk Workshop Upkeep"
 nd_alm_silk_workshop_upkeep_desc: "Looms, dyes, and the bookkeeping of the tiraz overseer."
 nd_alm_andalusi_tiraz: "Andalusi Tiraz"
 nd_alm_andalusi_tiraz_desc: "Embroidered robes of state and brocade silks woven in the al-Andalus tradition for export to all the Mediterranean courts."
 nd_alm_academy_upkeep: "Academy Upkeep"
 nd_alm_academy_upkeep_desc: "Imported books, paper for the cadets' notebooks, and the trial weapons of the artillery yard."

 # === Units ===
 a_nd_alm_masmuda_spearmen: "Masmuda Spearmen"
 a_nd_alm_masmuda_spearmen_desc: "Heavy infantry levied from the semi-nomadic Berbers of the High Atlas, organized by tribal hierarchy and fighting in dense formations."
 a_nd_alm_zenata_lancers: "Zenata Lancers"
 a_nd_alm_zenata_lancers_desc: "Light cavalry of the Maghrebi plateau, masters of the karr wa farr tactic of charge and feigned retreat."
 a_nd_alm_andalusi_crossbowmen: "Andalusi Crossbowmen"
 a_nd_alm_andalusi_crossbowmen_desc: "Urban militia of al-Andalus trained on the foot crossbow, providing the Caliphate's missile infantry alongside the Berber spear."
 a_nd_alm_christian_militia: "Christian Mercenary Militia"
 a_nd_alm_christian_militia_desc: "Iberian Christian mercenaries hired in regiments by the late Caliphate, paid in silver and quartered in Marrakesh: Castilian knights, Norman footmen, and adventurers from the Pyrenees."
 n_nd_alm_corsair_xebec: "Corsair Xebec"
 n_nd_alm_corsair_xebec_desc: "A swift Maghrebi galley with combined oar and lateen-rigged sail, raiding European shipping from Sale to Algiers and threading the Strait of Gibraltar."

 # === Levies ===
 levy_nd_alm_masmuda_spearmen: "Masmuda Levy"
 levy_nd_alm_masmuda_spearmen_desc: "Berber tribal infantry from the High Atlas."
 levy_nd_alm_zenata_lancers: "Zenata Cavalry Levy"
 levy_nd_alm_zenata_lancers_desc: "Light cavalry from the Zenata Berber nobility."
 levy_nd_alm_andalusi_crossbowmen: "Andalusi Crossbow Levy"
 levy_nd_alm_andalusi_crossbowmen_desc: "Urban crossbow militia from the cities of al-Andalus."