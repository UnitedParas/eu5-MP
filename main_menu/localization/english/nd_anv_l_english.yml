l_english:
 
 # === Variable tooltips ===
 nd_anv_formed_tt: "Angevin Empire formed"
 nd_anv_path_a_tt: "Path of Common Law of the Crown chosen"
 nd_anv_path_b_tt: "Path of Chivalric Confederation chosen"

 # === Advances: Age 1 Traditions ===
 nd_anv_exchequer_of_westminster: "Exchequer of Westminster"
 nd_anv_exchequer_of_westminster_desc: "The pipe rolls and the chequered cloth: Roger of Salisbury's exchequer turns royal accounts into the most sophisticated fiscal instrument in twelfth-century Europe."
 nd_anv_assize_courts: "Assize Courts and Royal Justices"
 nd_anv_assize_courts_desc: "Henry II's reforms send royal justices riding the realm. Disputes over land, homicide and theft now flow up to the crown rather than dissipating in seignorial halls."
 nd_anv_marcher_castles: "Marcher Castles"
 nd_anv_marcher_castles_desc: "The chains of stone keeps along the Welsh marches and the Norman frontier. Concentric fortification carried from the East by the Plantagenets and their Norman engineers."
 nd_anv_welsh_archers: "Welsh Archers in Royal Service"
 nd_anv_welsh_archers_desc: "The longbowmen of Gwent and Powys, kept on royal contract since the Welsh campaigns. The black-fletched arrows that pierced French mail at every Plantagenet field."
 nd_anv_norman_chivalry: "Norman Chivalry"
 nd_anv_norman_chivalry_desc: "Mounted men-at-arms in long mail hauberks, scions of the conquering Norman aristocracy. The shock arm of the Plantagenet host."
 nd_anv_forest_law: "Forest Law"
 nd_anv_forest_law_desc: "The royal forests, vast preserves under direct crown jurisdiction. Verderers, regarders and the harsh forest courts produce hated revenue and an unparalleled royal demesne."

 # === Advances: Age 2 Renaissance ===
 nd_anv_brabancons_routiers: "Brabançons and Routiers"
 nd_anv_brabancons_routiers_desc: "The Flemish and Lowland mercenary companies that fought for the highest Angevin bidder. Disciplined, professional, and feared, the standing edge of the Plantagenet army."
 nd_anv_gascon_crossbowmen: "Gascon Crossbowmen"
 nd_anv_gascon_crossbowmen_desc: "The crossbow militias of Bordeaux, Bayonne and the Gascon ports. Foot crossbowmen who shielded the wine fleets and held the southern marches."
 nd_anv_courtly_love: "Courtly Love and the Troubadours"
 nd_anv_courtly_love_desc: "Eleanor of Aquitaine's court at Poitiers: Marie de France, Bernart de Ventadorn, Chrétien de Troyes. The chivalric romance refined and exported across Christendom."
 nd_anv_winchester_assize: "Assize of Arms"
 nd_anv_winchester_assize_desc: "The Assize of Arms of 1181: every freeman to be equipped according to his estate. The basis of a national militia three centuries before any peer."
 nd_anv_bordeaux_wine_trade: "Bordeaux Wine Trade"
 nd_anv_bordeaux_wine_trade_desc: "The fleets that carry Gascon claret from Bordeaux to London, a Channel-spanning trade that binds Aquitaine to the English crown by silver as much as by oath."
 nd_anv_cinque_ports: "Cinque Ports Confederation"
 nd_anv_cinque_ports_desc: "Hastings, Sandwich, Dover, Romney, Hythe: the towns sworn to provide ships for the King in exchange for charters of self-government. The Channel fleet by feudal contract."

 # === Advances: Age 3 Discovery ===
 nd_anv_charter_towns: "Charter Towns and Burgesses"
 nd_anv_charter_towns_desc: "Henry II and his sons grant borough charters across the realm. Self-governing communes of merchants under royal protection, the seedbed of urban liberty."
 nd_anv_long_bowmen: "Massed Longbow Tactics"
 nd_anv_long_bowmen_desc: "The doctrine of arrow storms over advancing cavalry, practised at Falkirk, perfected at Crécy. The disciplined longbow archer in deep ranks."
 nd_anv_aquitanian_estates: "Estates of Aquitaine"
 nd_anv_aquitanian_estates_desc: "Customary parlements of Bordeaux, Poitiers and Saintes, where Gascon nobles, prelates and townsmen consented to ducal taxation. A constitutional precedent."
 nd_anv_chancellors_writ: "The Chancellor's Writ"
 nd_anv_chancellors_writ_desc: "The standardised royal writ runs throughout England and the duchies. The bureaucracy of the King's Chancery becomes the spine of trans-Channel governance."
 nd_anv_anglo_norman_ships: "Cogs of the Angevin Channel"
 nd_anv_anglo_norman_ships_desc: "The clinker-built Channel cogs of Sandwich and Rouen, the workhorses of a thalassocratic merchant marine, carrying English wool, Gascon wine and Norman herring."
 nd_anv_writ_of_summons: "Writ of Summons"
 nd_anv_writ_of_summons_desc: "Magnates summoned by name to attend the King's council. The seed of a parliamentary tradition that would outlive the Angevin polity itself."

 # === Advances: Age 4 Reformation ===
 nd_anv_anglo_norman_law_schools: "Anglo-Norman Law Schools"
 nd_anv_anglo_norman_law_schools_desc: "The Inns of Court and the law faculties of Caen and Angers, a cross-Channel jurisprudence taught in Latin and Anglo-Norman, training the magistrates of two crowns."
 nd_anv_calais_staple: "The Wool Staple"
 nd_anv_calais_staple_desc: "All raw English wool funnelled through a single royal staple, sealed and taxed before reaching the looms of Flanders. The crown's most lucrative monopoly."
 nd_anv_garrisons_pale: "Garrisons of the Pale"
 nd_anv_garrisons_pale_desc: "Marcher captains and royal garrisons hold the Lordship of Ireland, the Welsh principality and the Norman frontier as a chain of fortified districts under viceroys."
 nd_anv_great_council: "The Great Council"
 nd_anv_great_council_desc: "The magnum concilium of magnates and prelates, the standing Angevin advisory body that, in time, gives birth to Parliament and the Estates-General both."

 # === Advances: Age 5 Absolutism ===
 nd_anv_admiralty_at_arms: "Admiralty at Arms"
 nd_anv_admiralty_at_arms_desc: "The unified Plantagenet admiralty: Channel squadrons, Bay of Biscay convoys, Irish Sea patrols. A single navy for two kingdoms separated by salt water."
 nd_anv_garde_du_roi: "Garde du Roi"
 nd_anv_garde_du_roi_desc: "The royal household troops: gentlemen pensioners, yeomen of the guard, household cavalry. A standing core of professional soldiers loyal to the crown alone."
 nd_anv_two_jurisdictions: "Two Jurisdictions, One Crown"
 nd_anv_two_jurisdictions_desc: "English common law in the island, written civil law in the duchies, a deliberate asymmetric jurisprudence that respects custom while preserving sovereign integrity."
 nd_anv_atlantic_woollens: "Atlantic Woollens"
 nd_anv_atlantic_woollens_desc: "English broadcloth woven, fulled and dyed at home, no longer exported raw. The vertical integration of the Plantagenet textile economy."

 # === Advances: Age 6 Revolutions ===
 nd_anv_redcoat_drill: "Redcoat Drill"
 nd_anv_redcoat_drill_desc: "The drilled musket-and-bayonet line in scarlet, the disciplined volley fire of the Angevin regulars, redoubled by Anglo-Norman officer schools."
 nd_anv_rule_at_sea: "Rule at Sea"
 nd_anv_rule_at_sea_desc: "Wooden walls of the Channel, Atlantic and Mediterranean, the line-of-battle ship doctrine that makes the Angevin flag the master of three seas at once."
 nd_anv_constitutional_fusion: "Constitutional Fusion"
 nd_anv_constitutional_fusion_desc: "A bicameral assembly of lords and commons, sitting alternately in Westminster and Rouen, ratifies a written constitution binding crown, peerage and people."

 # === Custom Buildings ===
 nd_anv_exchequer_hall: "Exchequer Hall"
 nd_anv_exchequer_hall_desc: "The chequered cloth, the pipe rolls and the writs of summons. Royal accounts are calculated by counters on a chequered table; sheriffs render their farms before the King's barons twice a year."
 nd_anv_concentric_castle: "Concentric Castle"
 nd_anv_concentric_castle_desc: "Concentric walls, mural towers, postern gates and a great donjon, the Plantagenet castle as perfected at Dover, Château Gaillard and Beaumaris. The most formidable fortifications in twelfth-century Europe."
 nd_anv_assize_court: "Assize Court"
 nd_anv_assize_court_desc: "A royal hall where the King's justices in eyre hear pleas of land, of homicide and of trespass. The crown's justice, brought to the shire by writ and seal."
 nd_anv_chivalric_tournament_field: "Chivalric Tournament Field"
 nd_anv_chivalric_tournament_field_desc: "The lists, the pavilions, the heralds in tabards. A licensed tournament ground where the chivalry of the realm trains in arms and competes for honour and ransom."
 nd_anv_chartered_borough: "Chartered Borough"
 nd_anv_chartered_borough_desc: "A self-governing town under royal charter, with its own merchant guild, court of pie-powder and farm of the borough. Burgesses pay the crown directly in lieu of seignorial dues."
 nd_anv_gascon_winery: "Gascon Winery"
 nd_anv_gascon_winery_desc: "The vineyards of the Garonne and Dordogne: Bordeaux, Saint-Émilion, Cahors. Claret and red wine pressed for the English Channel market and the courts of Western Christendom."
 nd_anv_cinque_port_yard: "Cinque Port Yard"
 nd_anv_cinque_port_yard_desc: "A chartered port of the Cinque Ports confederation, sworn to provide cogs and crews to the King in exchange for self-government and a court of admiralty."
 nd_anv_anglo_norman_law_school: "Anglo-Norman Law School"
 nd_anv_anglo_norman_law_school_desc: "An inn of court or law faculty teaching the common law of England and the customary law of Normandy in parallel. Magistrates of the Plantagenet dual realm trained under one roof."

 # === PM Loc ===
 nd_anv_exchequer_upkeep: "Pipe Roll Accounting"
 nd_anv_exchequer_upkeep_desc: "Counters, pipe rolls, parchment, wax and the salaries of clerks of the chequer."
 nd_anv_concentric_castle_upkeep: "Castle Garrison Maintenance"
 nd_anv_concentric_castle_upkeep_desc: "Stone for repair, weaponry for the watch, food for the garrison and salaries for constables and serjeants."
 nd_anv_assize_court_upkeep: "Assize Court Sittings"
 nd_anv_assize_court_upkeep_desc: "Wax for seals, paper for plea rolls, hospitality for the King's justices riding their circuit."
 nd_anv_tournament_upkeep: "Tournament Patronage"
 nd_anv_tournament_upkeep_desc: "The upkeep of chivalric pageantry: pavilions, banners, weaponry, fine cloth for surcoats and the heralds' livery."
 nd_anv_chartered_borough_upkeep: "Borough Common Charges"
 nd_anv_chartered_borough_upkeep_desc: "The expenses of the burgesses' commune: paving, market regulation, watch and ward, and royal farm collection."
 nd_anv_gascon_wine_production: "Gascon Wine Vintage"
 nd_anv_gascon_wine_production_desc: "Pressing the Garonne grapes: wine for the Channel fleets and the courts of Christendom."
 nd_anv_cinque_port_yard_upkeep: "Yard Provisions and Cordage"
 nd_anv_cinque_port_yard_upkeep_desc: "Naval supplies, lumber and cordage for the cogs of the Cinque Ports squadron."
 nd_anv_law_school_upkeep: "Law School Stipendia"
 nd_anv_law_school_upkeep_desc: "Books, paper and the stipends of doctors of the common and customary laws."

 # === Custom Units ===
 a_nd_anv_welsh_archers: "Welsh Archers"
 a_nd_anv_welsh_archers_desc: "The longbowmen of Gwent and Powys, raised by Plantagenet contract. Their black-fletched yard-long arrows pierce mail and devastate cavalry charges."
 a_nd_anv_norman_chivalry: "Norman Knights"
 a_nd_anv_norman_chivalry_desc: "Mounted men-at-arms in long mail hauberks, descended from the Norman conquerors. The shock arm of the Plantagenet host."
 a_nd_anv_brabancons: "Brabançons"
 a_nd_anv_brabancons_desc: "Flemish and Brabantine mercenary infantry hired by the crown. Disciplined, professional and feared from Wales to Limousin."
 a_nd_anv_gascon_crossbowmen: "Gascon Crossbowmen"
 a_nd_anv_gascon_crossbowmen_desc: "The crossbow militias of Bordeaux, Bayonne and the Gascon ports. Disciplined urban infantry holding the southern marches."
 a_nd_anv_longbowmen: "Plantagenet Longbowmen"
 a_nd_anv_longbowmen_desc: "Massed longbow infantry trained under royal contract, the disciplined arrow storm of the Plantagenet host. The terror of French chivalry from Crécy onwards."
 a_nd_anv_household_cavalry: "Household Cavalry"
 a_nd_anv_household_cavalry_desc: "Gentlemen pensioners and yeomen of the guard, the King's standing household horse, mailed in the latest style and loyal to the crown alone."
 n_nd_anv_channel_cog: "Channel Cog"
 n_nd_anv_channel_cog_desc: "The clinker-built Channel cog of Sandwich and Rouen, broad of beam and tall of side. The workhorse of the Plantagenet merchant marine."
 n_nd_anv_great_ship: "Great Ship of the Line"
 n_nd_anv_great_ship_desc: "A first-rate ship of the line of the Angevin admiralty, broadside-armed and built to dominate the narrow seas and the Bay of Biscay."

 # === Levies ===
 levy_nd_anv_welsh_archers: "Welsh Archers"
 levy_nd_anv_welsh_archers_desc: "Longbow levy raised in the Welsh shires."
 levy_nd_anv_norman_chivalry: "Norman Knights"
 levy_nd_anv_norman_chivalry_desc: "Heavy cavalry levy from the Norman aristocracy of both shores of the Channel."
 levy_nd_anv_gascon_crossbowmen: "Gascon Crossbowmen"
 levy_nd_anv_gascon_crossbowmen_desc: "Urban crossbow levy from the Gascon ports and bastides."
 levy_nd_anv_longbowmen: "Plantagenet Longbowmen"
 levy_nd_anv_longbowmen_desc: "Trained massed longbow levy from the English shires."

 # === Age 6 industrial advance ===
 nd_anv_industrial_plantagenet: "Industrial Plantagenet"
 nd_anv_industrial_plantagenet_desc: "Iron of the Welsh marches, coal of the Black Country, water-powered mills along every river. The Plantagenet dominions enter the industrial age with iron and steam."