l_english:
 # === Variable tooltips (required for hidden_effect set_variable lines) ===
 nd_bnh_formed_tt: "Beth Nahrain has been formed."
 nd_bnh_path_a_tt: "Following the Patriarch's Restoration."
 nd_bnh_path_b_tt: "Following the Tur Abdin Defenders."
 nd_bnh_path_c_tt: "Following the Edessene Renaissance."
 
 # === Heritage Advances ===
 nd_bnh_catholicate_of_seleucia: "Catholicate of Seleucia"
 nd_bnh_catholicate_of_seleucia_desc: "The patriarchal seat of the Church of the East is restored at Mosul, with formal jurisdiction reasserted over the diaspora dioceses. The Catholicos becomes the kingdom's spiritual prime minister."
 nd_bnh_mor_gabriel_network: "Mor Gabriel Network"
 nd_bnh_mor_gabriel_network_desc: "The Tur Abdin monasteries (Mor Gabriel, Deir al-Zafaran, Mor Hananyo) are recognized as a state network, with their scriptoria, judicial chambers, and rural land grants formalized in royal charter."
 nd_bnh_tur_abdin_highlanders: "Tur Abdin Highlanders"
 nd_bnh_tur_abdin_highlanders_desc: "The monastic-village militia of the highland Tur Abdin, the same fighters who held the region under Artuqid, Mongol, and Aq Qoyunlu overlords, are formalized as a kingdom levy."
 nd_bnh_sawad_irrigation: "Sawad Irrigation"
 nd_bnh_sawad_irrigation_desc: "The qanat and canal infrastructure of the Tigris-Euphrates lowlands is rebuilt under crown administration. Surveyors map the broken Mongol-era networks; royal corps repair the breaches."
 nd_bnh_hudaye_book: "Hudaye Book of Laws"
 nd_bnh_hudaye_book_desc: "Bar Hebraeus' codification of Christian Mesopotamian civil law (1276, the Hudaye, the Book of Directions) is adopted as the kingdom's legal corpus, drawing on Roman, Sasanian, and Islamic precedent through a Syriac framework."
 nd_bnh_syriac_translation_movement: "Syriac Translation Movement"
 nd_bnh_syriac_translation_movement_desc: "The medieval translation programs are restored. Greek philosophy, Persian medicine, and Arabic astronomy enter Syriac in vast quantity, transmitted thence to Latin Christendom and the Arabic-speaking courts."
 nd_bnh_maphrianate: "Maphrianate of the East"
 nd_bnh_maphrianate_desc: "The Maphrian, the Patriarch's eastern vicar, governs Mesopotamian dioceses from Mosul while the Patriarch governs from Antioch. Two-headed religious administration extends the kingdom's diplomatic reach."
 nd_bnh_mosul_baghdad_caravans: "Mosul-Baghdad Caravans"
 nd_bnh_mosul_baghdad_caravans_desc: "The great corridor of Mesopotamian overland trade is reopened, linking the Anatolian highland routes to the Persian Gulf. Aramaic remains the lingua franca of the caravans."
 nd_bnh_edessene_schoolmen: "Edessene Schoolmen"
 nd_bnh_edessene_schoolmen_desc: "The inheritance of the School of Edessa, revived through the County of Edessa's Latin-Syriac academies. Greek and Latin scholarship fertilize the Syriac curriculum."
 nd_bnh_tur_abdin_wardens: "Tur Abdin Wardens"
 nd_bnh_tur_abdin_wardens_desc: "The monastic-chapter wardens of Mor Gabriel and the surrounding fortresses are professionalized into a buildable infantry guard, the regular formation that grew out of the highland militia."
 nd_bnh_mesopotamian_revival: "Mesopotamian Revival"
 nd_bnh_mesopotamian_revival_desc: "The systematic rebuilding of the canal grid south of Mosul. Royal engineers undertake what the Mongol catastrophe had broken: a Mesopotamian agricultural revival on Sasanian foundations."
 nd_bnh_silk_road_metropolitanate: "Silk Road Metropolitanate"
 nd_bnh_silk_road_metropolitanate_desc: "The Patriarchate's Silk Road dioceses (Samarkand, Khanbaliq, Malabar) are reactivated as state policy. The Church of the East's missionary network becomes a kingdom diplomatic instrument."
 nd_bnh_bar_hebraeus_court: "Bar Hebraeus' Court"
 nd_bnh_bar_hebraeus_court_desc: "The polymath Maphrian's circle of physicians, astronomers, and translators is constituted as the kingdom's academy. The Greek-Syriac-Arabic trilingual scholarship of his Mosul school becomes a state institution."
 nd_bnh_christian_diwan: "Christian Diwan"
 nd_bnh_christian_diwan_desc: "The kingdom adapts the Sasanian-Abbasid diwan model to Christian governance. Aramaic-script scribes administer revenue, military, and ecclesiastical accounts in parallel."
 nd_bnh_jundishapur_tradition: "Jundishapur Tradition"
 nd_bnh_jundishapur_tradition_desc: "The medical-academic tradition descended from the Sasanian academy of Gondeshapur, where Christian Nestorian physicians had preserved Galenic medicine, is restored as a kingdom institution."
 nd_bnh_patriarchal_diaspora: "Patriarchal Diaspora Network"
 nd_bnh_patriarchal_diaspora_desc: "The Patriarchate's correspondence with diaspora communities (from the Levant to Malabar) is converted into a formal diplomatic instrument under royal patronage."
 nd_bnh_highland_garrison: "Highland Garrison System"
 nd_bnh_highland_garrison_desc: "The Tur Abdin monastic-military system is extended into a kingdom-wide highland fort line answering to Mor Gabriel. Each fortress has its own monastic chapter."
 nd_bnh_riverine_pontoneers: "Riverine Pontoneers"
 nd_bnh_riverine_pontoneers_desc: "The kingdom's engineering corps specialize in Tigris-Euphrates bridge and pontoon work, the heirs of Sasanian and Abbasid riverine engineers."
 nd_bnh_crown_of_two_rivers: "Crown of the Two Rivers"
 nd_bnh_crown_of_two_rivers_desc: "The kingdom institutionalizes its Mesopotamian identity into a constitutional doctrine: the king as protector of the Two Rivers, of all who dwell between them: Syriac, Arabic, Kurdish, and Armenian alike."
 nd_bnh_aramaic_civil_service: "Aramaic Civil Service"
 nd_bnh_aramaic_civil_service_desc: "Bureaucratic Syriac is codified for kingdom-wide administration, parallel to the Arabic and Persian official languages of neighboring states. Aramaic-script scribes staff every diwan."
 nd_bnh_catholicate_constitutional: "Catholicate Constitutional"
 nd_bnh_catholicate_constitutional_desc: "The Catholicos of the East takes a formal advisory seat in the absolutist court, the Christian counterpart to Sunni and Shia ulema legal traditions."
 nd_bnh_mosul_foundries: "Mosul Foundries"
 nd_bnh_mosul_foundries_desc: "Iron from the Hakkari mountains and copper from the Diyarbakir hills feed the kingdom's late-era armaments industry, concentrated at Mosul."
 nd_bnh_syriac_print: "Syriac Print Revolution"
 nd_bnh_syriac_print_desc: "The kingdom adopts movable-type Syriac printing. Aramaic scripture, law, and chronicles finally have a printed life, transmitted across the diaspora."
 nd_bnh_mesopotamian_industry: "Mesopotamian Industry"
 nd_bnh_mesopotamian_industry_desc: "The riverine mills, foundries, and textile workshops of the lower Tigris are integrated into a single industrial base. Mesopotamia rejoins the productive economies of the modern world."
 nd_bnh_civic_synod: "Aramaic Civic Synod"
 nd_bnh_civic_synod_desc: "The patriarchal synod is converted into a civic chamber, giving Aramaic Christianity formal constitutional voice in the kingdom's late-era governance."
 # === Buildings ===
 nd_bnh_catholicate_palace: "Catholicate Palace"
 nd_bnh_catholicate_palace_desc: "The patriarchal seat at Mosul. The Catholicos of the East holds court here, administers diocesan justice, and maintains the Aramaic-script registry of the diaspora churches."
 nd_bnh_tur_abdin_monastery: "Tur Abdin Monastery"
 nd_bnh_tur_abdin_monastery_desc: "A hilltop monastic complex on the Mor Gabriel / Deir al-Zafaran model. Scriptorium, judicial chamber, and pilgrim hostel; the institution that held the Christian Mesopotamian population through every overlord change."
 nd_bnh_qanat_works: "Qanat Works"
 nd_bnh_qanat_works_desc: "Underground irrigation channels draining mountain aquifers into lowland fields, the engineering legacy of Sasanian and Abbasid Mesopotamia, restored under crown surveyors."
 nd_bnh_translation_house: "Syriac Translation House"
 nd_bnh_translation_house_desc: "Greek philosophy, Persian medicine, and Arabic astronomy enter Syriac here, then are forwarded westward through the Edessene channel into Latin. The institutional descendant of Bayt al-Hikma's Christian translators."
 nd_bnh_river_caravanserai: "River Caravanserai"
 nd_bnh_river_caravanserai_desc: "The great roadside hostels of the Mosul-Baghdad corridor, run by Aramaic-speaking Syriac-Christian guilds. The riverine artery of Mesopotamian commerce."
 nd_bnh_bar_hebraeus_library: "Bar Hebraeus Library"
 nd_bnh_bar_hebraeus_library_desc: "The great Mosul library of Maphrian Bar Hebraeus, inherited by his successors and rebuilt as the kingdom's flagship institution of learning. The Storehouse of Mysteries was first compiled here."
 nd_bnh_jundishapur_school: "Jundishapur Medical School"
 nd_bnh_jundishapur_school_desc: "The kingdom's restored medical academy, spiritual heir of the Sasanian Gondeshapur where Nestorian physicians had preserved Galenic medicine. Surgeons, herbalists, and astronomers train here."
 nd_bnh_highland_fortress: "Highland Fortress"
 nd_bnh_highland_fortress_desc: "The Tur Abdin model extended kingdom-wide. Each fortress combines a defensive stronghold with a small monastic chapter providing chaplaincy and judicial services to its garrison."
 nd_bnh_mosul_foundry: "Mosul Foundry"
 nd_bnh_mosul_foundry_desc: "Iron from the Hakkari mountains, copper from the Diyarbakir hills, all forged in the kingdom's central armaments works. Cannons cast here arm the late-era Beth Nahrain army."
 nd_bnh_river_manufactory: "Riverine Manufactory"
 nd_bnh_river_manufactory_desc: "Riverine mills powering textile and paper manufacture, the lower Tigris turned into an industrial corridor. Aramaic-language paper and book production for the diaspora."
 # === Building Production Methods ===
 nd_bnh_catholicate_upkeep: "Catholicate Upkeep"
 nd_bnh_catholicate_upkeep_desc: "Altar candles, registry paper, liturgical books, and incense for the patriarchal seat and its diocesan chancery."
 nd_bnh_tur_abdin_upkeep: "Monastery Upkeep"
 nd_bnh_tur_abdin_upkeep_desc: "Candles for the night office, manuscripts for the scriptorium, and incense for the sanctuary of the hilltop chapter."
 nd_bnh_qanat_upkeep: "Qanat Maintenance"
 nd_bnh_qanat_upkeep_desc: "Stone, timber shoring, and surveyors' tools to keep the underground channels clear and the lowland fields watered."
 nd_bnh_translation_books_pm: "Syriac Translation"
 nd_bnh_translation_books_pm_desc: "Greek philosophy, Persian medicine, and Arabic astronomy rendered into Syriac and bound for the schools of the East and the Latin West."
 nd_bnh_caravanserai_upkeep: "Caravanserai Upkeep"
 nd_bnh_caravanserai_upkeep_desc: "Cloth, fresh horses, timber, and candles to keep the roadside hostels of the Mosul-Baghdad corridor open to the caravans."
 nd_bnh_library_upkeep: "Library Upkeep"
 nd_bnh_library_upkeep_desc: "Paper, reference volumes, candles, and incense for the reading halls and copyists of the great Mosul library."
 nd_bnh_jundishapur_upkeep: "Medical School Upkeep"
 nd_bnh_jundishapur_upkeep_desc: "Paper, medical treatises, and compounded medicaments for the wards and lecture halls of the restored physicians' academy."
 nd_bnh_highland_fortress_upkeep: "Fortress Upkeep"
 nd_bnh_highland_fortress_upkeep_desc: "Quarried stone, dressed masonry, arms, and tools to hold and repair the highland strongholds and their monastic garrisons."
 nd_bnh_foundry_pm: "Cannon Foundry"
 nd_bnh_foundry_pm_desc: "Hakkari mountain iron, charcoal, and finished tools cast into the artillery of the late-era Beth Nahrain army."
 nd_bnh_river_paper_pm: "River Paper Mill"
 nd_bnh_river_paper_pm_desc: "Flax, rag, and grain sizing worked by the riverine mills into Aramaic-language paper for the kingdom's scribes and presses."
 nd_bnh_print_house_pm: "Aramaic Printing"
 nd_bnh_print_house_pm_desc: "Paper and binding worked into mass-printed Aramaic newspapers, Syriac textbooks, and vernacular law codes."
 # === Units & Levies ===
 a_nd_bnh_tur_abdin_highlander: "Tur Abdin Highlander"
 a_nd_bnh_tur_abdin_highlander_desc: "Levy infantry from the highland villages of Tur Abdin around Mor Gabriel, specialists in mountain defense. The militia that held the region under nine centuries of overlords."
 a_nd_bnh_tur_abdin_warden: "Tur Abdin Warden"
 a_nd_bnh_tur_abdin_warden_desc: "The professionalized monastic-chapter warden, recruited and drilled into a regular heavy-infantry formation. Disciplined defenders of the kingdom's northern flank."
 levy_nd_bnh_tur_abdin_highlanders: "Tur Abdin Highlander Levy"
 nd_bnh_aramaic_print_press: "Aramaic Print Press"
 nd_bnh_aramaic_print_press_desc: "The kingdom's industrial-era printing institution. Aramaic newspapers, Syriac textbooks, and vernacular law codes go from scriptorium technique to mass production."
 nd_bnh_aramaic_print_house: "Aramaic Print House"
 nd_bnh_aramaic_print_house_desc: "The industrial printing complex of the late kingdom, mass-producing Aramaic newspapers, Syriac textbooks, and vernacular law for the diaspora and the kingdom's domestic schools."