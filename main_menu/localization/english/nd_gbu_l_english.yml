l_english:
 # === Static Modifiers ===
 STATIC_MODIFIER_NAME_nd_gbu_toison_dor_elite: "Knights of the Golden Fleece"
 STATIC_MODIFIER_DESC_nd_gbu_toison_dor_elite: "The Toison d'Or is kept as Philip the Good designed it: thirty-one knights, the great houses of Burgundy bound by oath to the duke. A jewel-encrusted collar; an elite cavalry corps; the chivalric prestige of Christendom's most lavish court."
 STATIC_MODIFIER_NAME_nd_gbu_toison_dor_broad: "Broadened Fleece"
 STATIC_MODIFIER_DESC_nd_gbu_toison_dor_broad: "The Order is opened to lesser nobles and faithful captains. The fleece becomes a national chivalric institution rather than a closed dynastic circle, drawing the wider nobility into the king's service and projecting Burgundian honour across Europe."

 STATIC_MODIFIER_NAME_nd_gbu_flemish_cloth_charter: "Flemish Cloth Charter"
 STATIC_MODIFIER_DESC_nd_gbu_flemish_cloth_charter: "The drapers' guilds of Ghent, Bruges, and Ypres receive their privileges in writing: the right to inspect cloth, to set quality marks, to defend their monopoly. The looms double their output."

 # === DHE: Order of the Golden Fleece ===
 nd_gbu.2.t: "The Order of the Golden Fleece"
 nd_gbu.2.d: "On the tenth of January in the year 1430, in the great hall of his palace at Bruges, Philip the Good announces the founding of a new chivalric order on the day of his marriage to Isabella of Portugal. He names it the Toison d'Or, after the golden fleece of Jason and the Argonauts, and after the wool that has made Burgundy rich. Twenty-four knights are admitted at the founding, the great houses of the realm bound by oath to the duke. They wear a collar of jewels and golden links: the fleece itself dangles from each.\n\nThe Order is the most exclusive in Christendom. It is also a political instrument: every great noble who joins it owes the dynasty a personal debt of chivalric loyalty. But the founding raises a question that will shape the kingdom. Shall the Fleece remain the closed circle of Philip's design, thirty-one knights only? Or shall it grow, become a broader institution drawing in the wider nobility, projecting Burgundian honour across Europe?"
 nd_gbu.2.a: "Hold to the founding charter: thirty-one knights, an elite circle"
 nd_gbu.2.b: "Open the Order: broaden the fleece into a national chivalric institution"

 # === DHE: Flemish Cloth Charter ===
 nd_gbu.3.t: "The Cloth Charter"
 nd_gbu.3.d: "The drapers of Ghent, Bruges, and Ypres petition the crown for charter. They have woven the wool of England and the dyes of Picardy for two centuries. They want the right in writing: to inspect cloth at the loom, to mark it with the city's quality stamp, to forbid foreign merchants from buying unstamped goods. The crown grants the charter. Across the Low Countries, the looms double their pace, the fulling mills run day and night, and Flemish cloth marked with the wool guild's seal commands the highest prices in Europe."
 nd_gbu.3.a: "The cloth halls thrive."

 # === Advance Names ===
 nd_gbu_flemish_weaving_guilds: "Flemish Weaving Guilds"
 nd_gbu_flemish_weaving_guilds_desc: "The drapers of Bruges, Ghent, and Ypres organize the wool trade into city-controlled guilds. Their cloth, woven from English fleece, dyed in Picard madder, stamped with the city's quality mark, dominates the markets of Europe."
 nd_gbu_burgundian_court_ceremonial: "Burgundian Court Ceremonial"
 nd_gbu_burgundian_court_ceremonial_desc: "In the Coudenberg in Brussels and the Prinsenhof in Bruges, the Burgundian dukes maintain the most spectacular court of fifteenth-century Europe. Banquets, tournaments, processions, and the Order of the Golden Fleece project the dynasty's prestige across Christendom."
 nd_gbu_bruges_kontor: "The Bruges Kontor"
 nd_gbu_bruges_kontor_desc: "The Hanseatic counter at Bruges sits on a footing of equality with Lubeck. Burgundian merchants negotiate as principals, not as suppliers; the Bruges market overtakes the Hanse staple at Bergen and Novgorod."
 nd_gbu_burgundian_crossbow: "Burgundian Crossbow Levies"
 nd_gbu_burgundian_crossbow_desc: "The cloth cities maintain crossbow guilds: the Sint-Joris and Sint-Sebastiaan brotherhoods of Bruges and Ghent. Their members shoot at the popinjay weekly and stand ready to take the wall in war."
 nd_gbu_order_of_the_golden_fleece: "Order of the Golden Fleece"
 nd_gbu_order_of_the_golden_fleece_desc: "The Toison d'Or, founded at Bruges in 1430 by Philip the Good, is the most exclusive chivalric order in Christendom. Thirty-one knights bound by oath to the dynasty, distinguished by a collar of jewelled fleeces."
 nd_gbu_flemish_pikeman: "Flemish Pikeman Levies"
 nd_gbu_flemish_pikeman_desc: "The urban militias of the cloth cities serve in pike formation. The same men who broke French chivalry at Courtrai now stand ready as a renaissance pike-square."
 nd_gbu_flemish_cloth_charter_advance: "The Cloth Charter"
 nd_gbu_flemish_cloth_charter_advance_desc: "The drapers' guilds win written privileges from the crown: the right to inspect cloth, to mark it, to defend their monopoly against foreign merchants. The Flemish loom becomes the standard of European textile production."
 nd_gbu_estates_general_advance: "Estates General Convocation"
 nd_gbu_estates_general_advance_desc: "The Etats Generaux de Bourgogne assemble: nobles, clergy, and burghers of every duchy and county speak with one voice. The first composite parliamentary institution in Europe."
 nd_gbu_compagnies_dordonnance: "Compagnies d'Ordonnance"
 nd_gbu_compagnies_dordonnance_desc: "Charles the Bold reforms the Burgundian host on the French model: standing companies of paid men-at-arms, drilled in formation, rotated through garrison and field, paid from the treasury rather than from feudal levy."
 nd_gbu_burgundian_gendarme: "The Burgundian Gendarme"
 nd_gbu_burgundian_gendarme_desc: "The heavy cavalry of the ordonnance companies: full plate, barded horse, lance, and tactical reform. Charles's gendarmes are the most professional shock cavalry in Christendom."
 nd_gbu_coulevrinier_corps: "Coulevrinier Corps"
 nd_gbu_coulevrinier_corps_desc: "Burgundian handgunners armed with the couleuvrine, the early gunpowder firearm. They are recruited from the urban militias and stand alongside crossbowmen on the battle line."
 nd_gbu_trier_crown: "The Trier Crown"
 nd_gbu_trier_crown_desc: "The kingdom secures the royal recognition Charles negotiated with Emperor Frederick III at Trier in 1473. Burgundy stands as a sovereign monarchy, recognized across Christendom."
 nd_gbu_croix_de_bourgogne_advance: "Croix de Bourgogne"
 nd_gbu_croix_de_bourgogne_advance_desc: "The saltire of Saint Andrew, the rough red cross of knotted branches, is adopted as the field standard of every Burgundian battalion. The host marches under one banner."
 nd_gbu_mechelen_foundry_advance: "The Mechelen Cannon Foundry"
 nd_gbu_mechelen_foundry_advance_desc: "Mechelen becomes the continental arms centre. The Burgundian artillery train, organized in the tradition of the great bombards of Charles the Bold, delivers cast bronze cannon to the king's armies."
 nd_gbu_grand_privilege: "The Grand Privilege"
 nd_gbu_grand_privilege_desc: "The Estates secure constitutional limits on the crown: the right to consent to taxes, to summon their own assembly, to refuse foreign appointments. The kingdom is governed by negotiation, not by fiat."
 nd_gbu_low_countries_urbanism: "Low Countries Urbanism"
 nd_gbu_low_countries_urbanism_desc: "The densest urbanization in northern Europe: Antwerp, Brussels, Ghent, Bruges, Amsterdam, Liege. The Burgundian Low Countries hold a third of all the cities of the kingdom and produce most of its wealth."
 nd_gbu_antwerp_exchange: "The Antwerp Exchange"
 nd_gbu_antwerp_exchange_desc: "The Bourse of Antwerp, founded as the world's first commodity exchange. Burgundian merchants set the European price of pepper, copper, silver, and bills of exchange. The bourse becomes the financial heart of European commerce."
 nd_gbu_burgundian_inheritance: "Burgundian Inheritance Diplomacy"
 nd_gbu_burgundian_inheritance_desc: "The Burgundian dynastic web reaches from Cleves to Habsburg, from Lorraine to England. The kingdom's marriage strategy makes it a dynastic linchpin of European politics."
 nd_gbu_embellished_court: "The Embellished Court"
 nd_gbu_embellished_court_desc: "The Coudenberg expanded into a true royal palace; the court ceremonial of fifteenth-century Burgundy carried into the baroque era as a sovereign tradition rather than a Spanish-Habsburg import."
 nd_gbu_lotharingian_industry: "Lotharingian Industry"
 nd_gbu_lotharingian_industry_desc: "The early industrial belt of the Belgian provinces: Wallonia coal, Liege metalworking, Charleroi iron. The kingdom industrializes earliest among the continental powers."
 nd_gbu_belgian_textile_revolution: "The Belgian Textile Revolution"
 nd_gbu_belgian_textile_revolution_desc: "Mechanized cotton mills at Ghent on the British model; mechanized wool at Verviers; the Industrial Revolution arrives in the Low Countries. The cloth halls of the medieval city now serve as galleries above mills running day and night."
 nd_gbu_constitutional_estates: "Constitutional Estates"
 nd_gbu_constitutional_estates_desc: "The Estates General fully institutionalized as the constitutional partner of the crown. Nineteenth-century parliamentarism on Burgundian terms: a continuous tradition reaching back to Philip the Good."

 # === Building Names ===
 nd_gbu_flemish_cloth_hall: "Flemish Cloth Hall"
 nd_gbu_flemish_cloth_hall_desc: "The great public hall of the wool guilds, modelled on the Lakenhalle of Ypres and the Cloth Hall of Bruges. Cloth is inspected, stamped, taxed, and traded under one roof."
 nd_gbu_court_palace: "Burgundian Court Palace"
 nd_gbu_court_palace_desc: "The ducal palace (the Coudenberg, the Prinsenhof, the Hof ten Walle) where the most spectacular court of fifteenth-century Europe holds its banquets, tournaments, and chivalric ceremonies."
 nd_gbu_hanseatic_counter: "Hanseatic Counter"
 nd_gbu_hanseatic_counter_desc: "A trading counter on the Bruges model, dealing with the Hanseatic League on equal footing. Burgundian merchants trade as principals across the North Sea and the Baltic."
 nd_gbu_toison_dor_chapter_house: "Toison d'Or Chapter House"
 nd_gbu_toison_dor_chapter_house_desc: "The chapter house of the Order of the Golden Fleece. Knights of the order assemble here for chapter meetings, oaths of fealty, and the great festivals of chivalry."
 nd_gbu_gendarme_drill_yard: "Gendarme Drill Yard"
 nd_gbu_gendarme_drill_yard_desc: "The training ground of the compagnies d'ordonnance: standing companies of paid men-at-arms, drilled in formation, ready for the field. The first true standing army of the continental west."
 nd_gbu_mechelen_foundry: "Mechelen Cannon Foundry"
 nd_gbu_mechelen_foundry_desc: "The bronze foundry of Mechelen, casting cannon for the Burgundian artillery train. Continental arms centre and supplier of bombards across Europe."
 nd_gbu_antwerp_bourse: "Antwerp Bourse"
 nd_gbu_antwerp_bourse_desc: "The world's first true commodity exchange. Bills of exchange, bonds, copper, pepper, and a thousand other goods are quoted here, setting the European price daily."
 nd_gbu_belgian_textile_mill: "Belgian Textile Mill"
 nd_gbu_belgian_textile_mill_desc: "Mechanized cotton or wool mill on the British model. Ghent, Verviers, and Roubaix lead the Industrial Revolution in the Low Countries."

 # === PM Names ===
 nd_gbu_chapter_house_upkeep: "Order Maintenance"
 nd_gbu_chapter_house_upkeep_desc: "The ceremonial upkeep of the Order: collars, cloaks, banquets, the regalia of chivalric oath."
 nd_gbu_cloth_hall_weaving: "Flemish Wool Weaving"
 nd_gbu_cloth_hall_weaving_desc: "Wool spun, dyed, and woven into the famed Flemish broadcloth, stamped with the guild seal."
 nd_gbu_cloth_hall_fine_weaving: "Fine Cloth Production"
 nd_gbu_cloth_hall_fine_weaving_desc: "The finest grades of Flemish broadcloth, woven with imported silk thread and the deepest dyes for Europe's nobility."
 nd_gbu_court_palace_upkeep: "Court Ceremonial"
 nd_gbu_court_palace_upkeep_desc: "The provisioning of banquets, tournaments, processions, and the daily ceremonial of the Burgundian court."
 nd_gbu_kontor_upkeep: "Kontor Operations"
 nd_gbu_kontor_upkeep_desc: "The daily operations of the Hanseatic counter: ledgers, packing, shipping, and warehouse stores."
 nd_gbu_drill_yard_upkeep: "Compagnie Maintenance"
 nd_gbu_drill_yard_upkeep_desc: "The pay, mounts, equipment, and field training of the standing compagnies d'ordonnance."
 nd_gbu_mechelen_cannons: "Bronze Cannon Casting"
 nd_gbu_mechelen_cannons_desc: "Casting bronze cannon for the Burgundian artillery train: bombards, serpentines, and falconets in the Mechelen pattern."
 nd_gbu_bourse_upkeep: "Bourse Clearing"
 nd_gbu_bourse_upkeep_desc: "The clearing of bills, bonds, and accounts at the Antwerp Bourse, where the European price of every traded good is set daily."
 nd_gbu_textile_mill_weaving: "Mechanized Cloth"
 nd_gbu_textile_mill_weaving_desc: "Mechanized cotton or wool spinning and weaving at industrial scale, in the Ghent and Verviers tradition."

 # === Unit Names ===
 a_nd_gbu_crossbowman: "Burgundian Crossbowman"
 a_nd_gbu_crossbowman_desc: "Urban crossbowman of the Sint-Joris guilds. The disciplined, well-equipped missile infantry of the cloth cities, drilled at the popinjay every Sunday and ready to take the wall in war."
 a_nd_gbu_flemish_pikeman: "Flemish Pikeman"
 a_nd_gbu_flemish_pikeman_desc: "Urban pike militia of the Low Countries. The same communal infantry that broke French chivalry at Courtrai, now drilled in the renaissance pike-square."
 a_nd_gbu_gendarme: "Burgundian Gendarme"
 a_nd_gbu_gendarme_desc: "Heavy cavalry of the compagnies d'ordonnance: full plate, barded horse, couched lance. Charles the Bold's pride and the most professional shock cavalry of the late fifteenth century."
 a_nd_gbu_coulevrinier: "Coulevrinier"
 a_nd_gbu_coulevrinier_desc: "Burgundian handgunner armed with the couleuvrine: an early arquebus on a long stock. Recruited from the urban militias, the bridge between crossbow and musket."

 # === Levy Names ===
 levy_nd_gbu_crossbowman: "Crossbow Levy"
 levy_nd_gbu_crossbowman_desc: "Levy from the urban crossbow guilds of the cloth cities."
 levy_nd_gbu_flemish_pikeman: "Pikeman Levy"
 levy_nd_gbu_flemish_pikeman_desc: "Levy from the burgher pike militias of the Low Countries."

 # === Variable Tooltip Localization ===
 nd_gbu_formed_tt: "Greater Burgundy formed"
 nd_gbu_path_a_tt: "Frankish-Imperial Kingdom path"
 nd_gbu_path_b_tt: "Estates Kingdom path"

 # === Additional advance loc ===
 nd_gbu_burgundian_painting: "Flemish Painting"
 nd_gbu_burgundian_painting_desc: "Van Eyck's Ghent Altarpiece, Van der Weyden's portraits, Memling and Bouts, the Flemish Primitives establish a continental school of art whose realism, oil technique, and devotional intensity become the standard of European painting."
 nd_gbu_dunkirk_privateers: "Burgundian Channel Privateers"
 nd_gbu_dunkirk_privateers_desc: "Letters of marque issued from Dunkirk, Ostend, and Nieuwpoort. Burgundian corsairs harry English and French shipping in the Channel and the North Sea, screening the kingdom's trade in war."

 # === Walloon Coal Basin ===
 nd_gbu_walloon_coal: "Walloon Coal Basin"
 nd_gbu_walloon_coal_desc: "The Sambre-Meuse coal belt: Charleroi, Mons, the Borinage. The richest coalfield of continental Europe and the foundation of Belgian heavy industry."
 nd_gbu_walloon_coalworks: "Sambre-Meuse Coalworks"
 nd_gbu_walloon_coalworks_desc: "An industrial-era pit mine extracting coal from the Walloon basin. Charleroi, Mons, and the Borinage drive the kingdom's industrialization."
 nd_gbu_walloon_coal_mining: "Coal Extraction"
 nd_gbu_walloon_coal_mining_desc: "Pit mining of bituminous coal from the Sambre-Meuse seams, the heart of continental industrial fuel."