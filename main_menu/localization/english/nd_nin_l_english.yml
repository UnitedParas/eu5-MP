l_english:

# === Advance Display Names ===
 nd_nin_kisir_sharruti: "Kisir Sharruti"
 nd_nin_kisir_sharruti_desc: "The Sargonid standing army restored. Tiglath-Pileser III's 745 BC reform, the world's first paid year-round professional corps, refounded as the empire's military backbone."
 nd_nin_qurubuti: "Qurubuti Royal Guard"
 nd_nin_qurubuti_desc: "The empire's heavy mounted bodyguard, oath-bound at the Akitu festival, drawn from the noble houses of the patriarchal court. The closest of the close to the imperial throne."
 nd_nin_sapan_mati: "Sapan Mati Doctrine"
 nd_nin_sapan_mati_desc: "The Land of the Mountains frontier doctrine. Sargonid armies operated systematically beyond the imperial heartland into Urartu, the Zagros, and the Taurus; no enemy lay safely beyond reach."
 nd_nin_lamassu_monumentalism: "Lamassu Monumentalism"
 nd_nin_lamassu_monumentalism_desc: "Colossal bull-bodied human-headed gate guardians, identified by patriarchal homilies with the cherubim of Genesis, raised at every imperial residence. Sargonid monumental practice in Christian dress."
 nd_nin_tab_rabuti: "Tab-rabuti"
 nd_nin_tab_rabuti_desc: "The great resettlement administrators of the Sargonids. Conquered populations transferred and integrated, regional resistances broken by deliberate dispersal. The administrative instrument that bound the empire."
 nd_nin_imperial_siege_doctrine: "Imperial Siege Doctrine"
 nd_nin_imperial_siege_doctrine_desc: "The Sargonid siege apparatus, the most sophisticated of antiquity. Battering rams, mobile siege towers, undermining corps, ramp engineers, the world's first systematic siege school."
 nd_nin_aramaic_chancery: "Aramaic Imperial Chancery"
 nd_nin_aramaic_chancery_desc: "The Sargonid administrative innovation scaled to empire. Aramaic, the lingua franca of the Patriarchate, becomes the imperial civil service language."
 nd_nin_imperial_riverine_fleet: "Imperial Riverine Fleet"
 nd_nin_imperial_riverine_fleet_desc: "Sennacherib's military canals and Tigris-Euphrates fleet refounded. The Mosul-Basra corridor as combined military-and-commercial waterway."
 nd_nin_akitu_coronation: "Akitu Coronation"
 nd_nin_akitu_coronation_desc: "The Mesopotamian new-year festival refounded as Christian imperial coronation rite. The Patriarch crowns the emperor; the senior governors swear their annual oaths; the divine mandate is renewed."
 nd_nin_sargonid_provinces: "Sargonid Provincial System"
 nd_nin_sargonid_provinces_desc: "The seventy-province administrative template of Esarhaddon. Each province ruled by a sakin temi answering to the imperial chancery, with garrison, fiscal, and religious accounts kept in parallel."
 nd_nin_imperial_standing_army: "Imperial Standing Army"
 nd_nin_imperial_standing_army_desc: "The kisir sharruti scaled to empire. Every province furnishes a fixed quota of standing infantry; the core is paid year-round; the empire's professionalization matches the Sargonid model at imperial scale."
 nd_nin_library_restored: "Library of Ashurbanipal"
 nd_nin_library_restored_desc: "The greatest systematic library of antiquity refounded at the imperial capital. Sargonid catalog conventions and the Patriarchate's translator-corps fuse into a unified imperial archive."
 nd_nin_levantine_administration: "Levantine Administration"
 nd_nin_levantine_administration_desc: "The Sargonid template for the eastern Mediterranean: provincial governors at the great cities, vassal arrangements for the coastal trading kingdoms, tribute-and-garrison infrastructure across the Levant."
 nd_nin_annal_stelae: "Annal Stelae"
 nd_nin_annal_stelae_desc: "The Sargonid royal annal-stelae raised at the empire's borders to record campaigns, treaties, and tributary submissions. A formal diplomatic-and-prestige instrument refounded by the empire."
 nd_nin_imperial_khorsabad: "Imperial Khorsabad"
 nd_nin_imperial_khorsabad_desc: "The Dur-Sharrukin model: a planned imperial capital quarter with palace, temple, fortifications, and granaries laid out as a single project. The empire commissions one at the imperial seat."
 nd_nin_egyptian_province: "The Egyptian Province"
 nd_nin_egyptian_province_desc: "Esarhaddon's Memphis (671 BC), Ashurbanipal's Thebes (663 BC). The Sargonid integration of the Nile into the imperial system, restored as imperial doctrine: Egypt as province, garrisoned and taxed."
 nd_nin_imperial_tribute: "Imperial Tribute System"
 nd_nin_imperial_tribute_desc: "The Sargonid administration of vassal kings: annual tribute, fixed quotas, garrisoned overseers, the threat of provincialization for breaches. The empire's formal subject-management apparatus."
 nd_nin_royal_officer_corps: "Royal Officer Corps"
 nd_nin_royal_officer_corps_desc: "The empire's professional officers, trained at the imperial palace school. The medieval-era empire fuses the Sargonid eunuch-bureaucrat tradition with the cathedral school curriculum of Mosul and Baghdad."
 nd_nin_scribal_schools: "Scribal Schools"
 nd_nin_scribal_schools_desc: "The empire's network of palace and provincial scribal schools, descended from the Sargonid scribal academies and fused with the Patriarchate's cathedral schools. Aramaic, Greek, Latin, Persian, and the cuneiform corpus all taught."
 nd_nin_imperial_absolutism: "Imperial Absolutism"
 nd_nin_imperial_absolutism_desc: "The Sargonid concept of total imperial authority absorbed into the empire's absolutist constitution. The emperor as the unique earthly representative of divine order, with the Catholicos as chief consecrating prelate."
 nd_nin_lamassu_quarter: "Lamassu Royal Quarter"
 nd_nin_lamassu_quarter_desc: "The imperial palace quarter rebuilt at the Sargonid template: lamassu-gated, ziggurat-cathedraled, a continuous palace city stretching from the patriarchal seat to the imperial barracks."
 nd_nin_imperial_aramaic: "Imperial Aramaic"
 nd_nin_imperial_aramaic_desc: "The codification of Aramaic as the formal administrative language of the entire empire. The chancery, the courts, the imperial correspondence, the tax rolls, all in Aramaic letters."
 nd_nin_imperial_levies: "Imperial Levies"
 nd_nin_imperial_levies_desc: "The empire's standing levies drawn from every integrated province, descendants of the Sargonid corps of deportees and provincial conscripts. The empire's manpower base expands to imperial scale."
 nd_nin_annexation_doctrine: "Annexation Doctrine"
 nd_nin_annexation_doctrine_desc: "The Sargonid doctrine of escalation: tributary, then vassal, then province. The empire applies this consistently and absorbs subjects into direct rule on a fixed timeline."
 nd_nin_imperial_industry: "Imperial Industrial Base"
 nd_nin_imperial_industry_desc: "The empire's late-era industrial complex, built atop Sargonid riverine logistics, patriarchal scriptoria, and Mosul foundries. An industrial Mesopotamia centered on the imperial capital."
 nd_nin_lamassu_academy: "Lamassu Academy"
 nd_nin_lamassu_academy_desc: "The imperial military-and-administrative academy, named for the bull-cherubim guardians at its gates. General staff, civil service cadets, and senior clergy share an Aramaic-and-Greek curriculum."
 nd_nin_imperial_constitution: "Imperial Constitution"
 nd_nin_imperial_constitution_desc: "The late empire's formal constitutional settlement: crown, patriarch, senate of provincial governors, and Aramaic civil service codified into a single document modeled on the Sargonid royal annals."
 nd_nin_pan_aramaic_press: "Pan-Aramaic Press"
 nd_nin_pan_aramaic_press_desc: "The imperial press, descended from the Patriarchate's Aramaic-script printing house. Newspapers, official gazettes, and educational textbooks distributed across every imperial province."
 nd_nin_destiny: "Imperial Destiny"
 nd_nin_destiny_desc: "The Bull of Heaven walks the earth. The empire is formed; the path of imperial fulfillment lies open."

# === Building Display Names ===
 nd_nin_lamassu_gate: "Lamassu Gate"
 nd_nin_lamassu_gate_desc: "Colossal bull-bodied human-headed gate guardians at the imperial gates. The Sargonid monumental tradition restored, identified with the cherubim of Christian iconography."
 nd_nin_aramaic_chancery_building: "Imperial Chancery"
 nd_nin_aramaic_chancery_building_desc: "The empire's civil service headquarters, operating in Aramaic per Sargonid template. Provincial fiscal, judicial, and ecclesiastical accounts converge here."
 nd_nin_riverine_naval_yard: "Riverine Naval Yard"
 nd_nin_riverine_naval_yard_desc: "The Tigris-Euphrates fleet anchorage. Sennacherib's military canal infrastructure restored as a combined military and commercial waterway."
 nd_nin_akitu_square: "Akitu Festival Square"
 nd_nin_akitu_square_desc: "The great open square at the imperial capital where the Akitu new-year coronation rite is celebrated. The Patriarch crowns the emperor; the lamassu cherubim flank the altar."
 nd_nin_kisir_barracks: "Kisir Sharruti Barracks"
 nd_nin_kisir_barracks_desc: "The standing-army barracks of the imperial kisir, the year-round professional infantry the Sargonids pioneered."
 nd_nin_library_of_ashurbanipal: "Library of Ashurbanipal"
 nd_nin_library_of_ashurbanipal_desc: "The largest systematic library since Alexandria, refounded at the imperial capital. Sargonid catalog conventions, patriarchal translation corps, and the surviving cuneiform corpus all under one roof."
 nd_nin_annal_stele: "Annal Stele"
 nd_nin_annal_stele_desc: "A monumental inscribed stele recording campaigns, treaties, or tributary submissions. Sargonid royal annal practice as a formal diplomatic-and-prestige instrument."
 nd_nin_imperial_palace: "Imperial Palace at Khorsabad"
 nd_nin_imperial_palace_desc: "A planned imperial capital quarter on the Khorsabad / Dur-Sharrukin model. Palace, temple, fortifications, and granaries laid out together as a single imperial commission."
 nd_nin_scribal_school: "Scribal School"
 nd_nin_scribal_school_desc: "An imperial scribal academy fusing Sargonid and patriarchal traditions. Aramaic, Greek, Latin, and Persian instruction; the Sargonid cuneiform corpus preserved for advanced study."
 nd_nin_imperial_quarter: "Imperial Quarter"
 nd_nin_imperial_quarter_desc: "The late absolutist palace quarter at the imperial capital. Lamassu-gated, ziggurat-cathedraled, a continuous palace city from patriarchal seat to imperial barracks."
 nd_nin_imperial_arsenal: "Imperial Arsenal"
 nd_nin_imperial_arsenal_desc: "The late-era industrial armaments complex of the empire. Cannons, firearms, and steel for the imperial corps, drawing on the Mosul foundries and the riverine workshops."

# === Production Method Loc ===
 nd_nin_lamassu_gate_upkeep: "Lamassu Gate Upkeep"
 nd_nin_lamassu_gate_upkeep_desc: "Stone, masonry, and ritual goods to maintain the cherubic guardians and their flanking shrines."
 nd_nin_chancery_upkeep: "Chancery Operations"
 nd_nin_chancery_upkeep_desc: "Paper, ink-wax, books, and incense for the daily work of the imperial Aramaic civil service."
 nd_nin_naval_yard_upkeep: "Naval Yard Operations"
 nd_nin_naval_yard_upkeep_desc: "Lumber, tar, naval supplies, and tools for maintaining the imperial riverine fleet."
 nd_nin_akitu_upkeep: "Akitu Festival Upkeep"
 nd_nin_akitu_upkeep_desc: "Incense, beeswax, paper, and wine for the empire's coronation rite and its annual recurrences."
 nd_nin_kisir_upkeep: "Kisir Standing Army Upkeep"
 nd_nin_kisir_upkeep_desc: "Weaponry, cloth, horses, and grain to sustain the year-round professional corps."
 nd_nin_library_upkeep: "Library Operations"
 nd_nin_library_upkeep_desc: "Paper, books, beeswax, and incense for the work of the imperial archive."
 nd_nin_annal_stele_upkeep: "Stele Maintenance"
 nd_nin_annal_stele_upkeep_desc: "Stone, masonry, and ritual wax for maintaining the empire's monumental inscriptions."
 nd_nin_palace_upkeep: "Palace Operations"
 nd_nin_palace_upkeep_desc: "Stone, masonry, fine cloth, and incense for the imperial residence and its court."
 nd_nin_scribal_upkeep: "Scribal School Operations"
 nd_nin_scribal_upkeep_desc: "Paper, books, beeswax, and incense for the imperial scribal curriculum."
 nd_nin_imperial_quarter_upkeep: "Imperial Quarter Operations"
 nd_nin_imperial_quarter_upkeep_desc: "Stone, masonry, fine cloth, and weaponry for the absolutist palace city."
 nd_nin_arsenal_pm: "Imperial Arsenal Production"
 nd_nin_arsenal_pm_desc: "Iron, coal, and tools forged into weaponry for the imperial corps."

# === Unit Display Names ===
 a_nd_nin_kisir_sharruti: "Kisir Sharruti"
 a_nd_nin_kisir_sharruti_desc: "The empire's professional standing infantry, the world's first paid year-round corps. Sargonid template restored under the Patriarchate's banner."
 a_nd_nin_qurubuti: "Qurubuti"
 a_nd_nin_qurubuti_desc: "The royal guard cavalry of the empire. Heavy mounted bodyguard, oath-bound at the Akitu festival, drawn from the noble houses of the patriarchal court."
 a_nd_nin_siege_corps: "Imperial Siege Corps"
 a_nd_nin_siege_corps_desc: "The Sargonid siege apparatus restored at scale. Battering rams, mobile siege towers, undermining corps, and ramp engineers in a coordinated formation."
 a_nd_nin_aramean_auxiliary: "Aramean Auxiliary"
 a_nd_nin_aramean_auxiliary_desc: "Levy infantry from the Aramaic-speaking countryside of the empire. The descendants of the Sargonid corps of deportees, made into a standing auxiliary class."

# === Levy Display Names ===
 levy_nd_nin_aramean_auxiliary: "Aramean Auxiliary Levy"
 levy_nd_nin_aramean_auxiliary_desc: "Levy infantry raised from the empire's Aramaic-speaking peasant and soldier pops in Mesopotamia and the Levant."

