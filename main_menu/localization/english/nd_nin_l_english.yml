 nd_nin_path_a_tt: "Founding doctrine: Sargonid Imperium."
 nd_nin_path_b_tt: "Founding doctrine: Pax Assyriaca."
 nd_nin_path_c_tt: "Founding doctrine: Cross and Lamassu."