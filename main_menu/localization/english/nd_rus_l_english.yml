l_english:

 nd_rus_druzhina_tradition: "Druzhina Tradition"
 nd_rus_druzhina_tradition_desc: "The druzhina (the personal retinue of mounted warriors serving the prince) forms the core of early Russian military power, a tradition that evolves into the Cossack hosts of the frontier."
 nd_rus_veche_assemblies: "Veche Assemblies"
 nd_rus_veche_assemblies_desc: "The veche, or popular assembly, provides a forum for collective decision-making in Russian cities, tempering princely authority with civic participation."
 nd_rus_fur_trade: "Fur Trade Foundations"
 nd_rus_fur_trade_desc: "Russia's northern forests yield an abundance of sable, fox, and ermine, forming the backbone of early Russian commerce and drawing merchants from as far as Constantinople and the Islamic world."
 nd_rus_gathering_of_lands: "Gathering of the Russian Lands"
 nd_rus_gathering_of_lands_desc: "Under Ivan III, Moscow systematically absorbs the independent Russian principalities (Novgorod, Tver, Yaroslavl, Rostov), forging a unified state from the patchwork of medieval appanages."
 nd_rus_third_rome: "Third Rome"
 nd_rus_third_rome_desc: "After the fall of Constantinople in 1453, Moscow claims the mantle of the Third Rome: the last guardian of Orthodox Christianity, with the Tsar as God's representative on earth."
 nd_rus_sudebnik: "Sudebnik Law Code"
 nd_rus_sudebnik_desc: "The Sudebnik of 1497 establishes a unified legal code for all Russian lands, replacing the patchwork of local customs with centralized justice administered by the Grand Prince's courts."
 nd_rus_merchant_courts: "Gostiny Dvor Tradition"
 nd_rus_merchant_courts_desc: "The gostiny dvor (merchant courts where traders from across Russia and foreign lands gather to conduct business) becomes a cornerstone of Russian commercial life, regulated by the state for order and revenue."
 nd_rus_stone_kremlins: "Stone Kremlins"
 nd_rus_stone_kremlins_desc: "Russian cities replace their wooden palisades with imposing stone kremlin fortresses, creating formidable citadels that serve as seats of both military defense and political authority."
 nd_rus_pomestye_system: "Pomestye Service Estates"
 nd_rus_pomestye_system_desc: "The pomestye system grants conditional land estates to military servitors in exchange for mounted service, creating a new class of service nobles bound to the Tsar's army."
 nd_rus_boyar_duma: "Boyar Duma"
 nd_rus_boyar_duma_desc: "The Boyar Duma, an advisory council of the highest-ranking nobles and clergy, deliberates on matters of state, war, and law at the Tsar's pleasure."
 nd_rus_streltsy_corps: "Streltsy Corps"
 nd_rus_streltsy_corps_desc: "Ivan IV establishes the Streltsy, Russia's first permanent standing infantry armed with firearms. Salaried and uniformed, they represent a decisive step toward a professional army."
 nd_rus_oprichnina: "Oprichnina"
 nd_rus_oprichnina_desc: "Ivan IV creates the oprichnina, a state-within-a-state governed by his personal guard of black-clad oprichniki, who enforce the Tsar's absolute authority through terror and confiscation."
 nd_rus_siberian_conquest: "Siberian Conquest"
 nd_rus_siberian_conquest_desc: "The conquest of the Khanate of Sibir opens the way to the vast wilderness beyond the Urals, where Cossack explorers and fur traders push the frontier ever eastward toward the Pacific."
 nd_rus_orthodox_arts: "Orthodox Cultural Renaissance"
 nd_rus_orthodox_arts_desc: "Russian icon painting, church architecture, and liturgical music reach new heights of artistic achievement, creating a distinctive Orthodox cultural tradition that rivals the art of Byzantium itself."
 nd_rus_smuta_resilience: "Smuta Resilience"
 nd_rus_smuta_resilience_desc: "The Time of Troubles tests Russia to its breaking point (famine, invasion, civil war, and pretenders to the throne), but the nation endures, emerging with a deepened sense of national identity and resilience."
 nd_rus_grain_spirits: "Grain Spirits Industry"
 nd_rus_grain_spirits_desc: "Russian distillers perfect the production of grain-based spirits, creating a domestic industry that generates significant revenue for the state treasury through monopoly sales."
 nd_rus_cossack_hosts: "Cossack Hosts"
 nd_rus_cossack_hosts_desc: "The semi-autonomous Cossack communities of the Don, Zaporozhian Sich, and Yaik are formalized as military hosts, providing the empire with superb light cavalry in exchange for land and self-governance."
 nd_rus_prikazy_system: "Prikazy System"
 nd_rus_prikazy_system_desc: "The prikazy, or government departments, evolve from ad hoc commissions into a permanent bureaucratic apparatus, each responsible for a specific function of state: foreign affairs, military supply, treasury, justice."
 nd_rus_patriarch: "Patriarchate of Moscow"
 nd_rus_patriarch_desc: "The establishment of the Patriarchate of Moscow in 1589 elevates the Russian Church to full independence, confirming Moscow's spiritual authority over all Orthodox believers."
 nd_rus_new_regiments: "New Formation Regiments"
 nd_rus_new_regiments_desc: "European-trained officers drill Russian soldiers in Western military methods, creating 'new formation' regiments of infantry, dragoons, and reiters that supplement the traditional Streltsy and feudal cavalry."
 nd_rus_ural_ironworks: "Ural Ironworks"
 nd_rus_ural_ironworks_desc: "The Ural Mountains yield vast deposits of iron ore, and the establishment of state-sponsored foundries transforms Russia into one of Europe's largest producers of iron and cannon."
 nd_rus_ulozheniye: "Sobornoye Ulozheniye"
 nd_rus_ulozheniye_desc: "The Law Code of 1649 codifies the social hierarchy of the Russian state, binding peasants permanently to the land as serfs and establishing the legal framework of autocratic governance that will persist for two centuries."
 nd_rus_don_host: "Don Cossack Host"
 nd_rus_don_host_desc: "The Don Cossacks are formally recognized as a military estate of the empire, providing elite light cavalry for the Tsar's campaigns in exchange for autonomy on their ancestral lands along the Don River."
 nd_rus_petrine_navy: "Petrine Naval Reforms"
 nd_rus_petrine_navy_desc: "Peter the Great, having labored as an apprentice shipwright in Dutch and English dockyards, returns to build Russia a navy from nothing: establishing naval academies, dockyards, and the new capital of St. Petersburg as a window to the sea."
 nd_rus_baltic_fleet: "Baltic Fleet"
 nd_rus_baltic_fleet_desc: "The creation of the Baltic Fleet transforms Russia from a landlocked power into a naval force capable of contesting the Baltic Sea, challenging Swedish dominance and securing Russia's access to European trade."
 nd_rus_table_of_ranks: "Table of Ranks"
 nd_rus_table_of_ranks_desc: "Peter the Great's Table of Ranks replaces hereditary privilege with meritocratic service, classifying all civil and military positions into fourteen grades and opening advancement to talent regardless of birth."
 nd_rus_guberniya: "Guberniya System"
 nd_rus_guberniya_desc: "The empire is reorganized into guberniyas (provinces governed by appointed governors answerable directly to the central government), replacing the old patchwork of local administration."
 nd_rus_military_colonies: "Military Colonization"
 nd_rus_military_colonies_desc: "Soldier-settlers are established in frontier regions, combining military duty with agricultural cultivation to provide both defense and sustenance for the expanding empire."
 nd_rus_suvorov_school: "Suvorov's Military School"
 nd_rus_suvorov_school_desc: "Alexander Suvorov's doctrines of speed, aggression, and bayonet assault produce a generation of elite grenadiers who fight with unmatched ferocity and tactical initiative."
 nd_rus_great_power_diplomacy: "Great Power Diplomacy"
 nd_rus_great_power_diplomacy_desc: "Russia's emergence as a European great power demands a sophisticated diplomatic corps, and the empire now maintains ambassadors at every major court, wielding influence from Paris to Constantinople."
 nd_rus_enlightenment: "Russian Enlightenment"
 nd_rus_enlightenment_desc: "Catherine the Great corresponds with Voltaire and Diderot, establishes the Free Economic Society, and founds schools across the empire. Russian letters, science, and philosophy flourish as never before."
 nd_rus_industrial_dawn: "Industrial Dawn"
 nd_rus_industrial_dawn_desc: "The first stirrings of industrialization reach Russia as mechanized production begins in textiles and metalworking, and state-sponsored factories multiply across the Urals and around Moscow."
 a_nd_rus_streltsy: "Streltsy"
 a_nd_rus_streltsy_desc: "Moscow's standing musket infantry, uniformed and salaried, armed with matchlock firearms and heavy bardiches. The backbone of Russian military power in the age of gunpowder."
 a_nd_rus_cossack_cavalry: "Cossack Light Cavalry"
 a_nd_rus_cossack_cavalry_desc: "Steppe horsemen from the frontier communities, expert riders and raiders who serve as the empire's eyes and ears across the vast southern borderlands."
 a_nd_rus_oprichnik: "Oprichnik Cavalry"
 a_nd_rus_oprichnik_desc: "The Tsar's personal enforcers, black-clad horsemen who carry a dog's head and broom at their saddle, symbols of their mission to sniff out and sweep away treason."
 a_nd_rus_don_cossack: "Don Cossack"
 a_nd_rus_don_cossack_desc: "Elite horsemen of the Don Cossack Host, veteran cavalrymen who combine steppe riding traditions with disciplined military service to the empire."
 a_nd_rus_suvorov_grenadier: "Suvorov Grenadier"
 a_nd_rus_suvorov_grenadier_desc: "Elite infantry trained in Suvorov's doctrine of speed and bayonet assault. 'The bullet is a fool, the bayonet a fine fellow.' These men embody that creed."
 n_nd_rus_baltic_frigate: "Baltic Frigate"
 n_nd_rus_baltic_frigate_desc: "A fast warship of the Russian Baltic Fleet, built in the new dockyards of St. Petersburg to contest Swedish dominance of the northern seas."
 nd_rus_gostiny_dvor: "Gostiny Dvor"
 nd_rus_gostiny_dvor_desc: "A merchant court where traders from across Russia and foreign lands gather to sell their wares under state regulation, fostering orderly commerce and tax collection."
 nd_rus_gostiny_dvor_upkeep: "Gostiny Dvor Maintenance"
 nd_rus_gostiny_dvor_upkeep_desc: "Upkeep costs for maintaining the merchant court: timber for construction, stone for repairs, paper for trade records and contracts, and cloth for display and merchant needs."
 nd_rus_kreml: "Stone Kremlin"
 nd_rus_kreml_desc: "A fortified stone citadel at the heart of a Russian city, combining military defense with the seat of political authority and Orthodox worship."
 nd_rus_kreml_garrison: "Kremlin Garrison"
 nd_rus_kreml_garrison_desc: "The permanent garrison that maintains the kremlin's defenses, consuming weapons, stone for repairs, firearms for the soldiers, and tools for construction and maintenance."
 nd_rus_ural_foundry: "Ural Ironworks"
 nd_rus_ural_foundry_desc: "A state-sponsored iron foundry in the Ural Mountains, smelting the region's vast ore deposits into iron and steel for the empire's arsenals."
 nd_rus_iron_smelting: "Ural Iron Smelting"
 nd_rus_iron_smelting_desc: "Industrial-scale smelting of Ural iron ore into high-quality steel using charcoal and coke-fired blast furnaces."
 nd_rus_naval_academy: "Naval Academy"
 nd_rus_naval_academy_desc: "A school of navigation and shipbuilding established in the Petrine tradition, training officers and craftsmen to build and sail Russia's growing fleet."
 nd_rus_naval_academy_upkeep: "Naval Academy Upkeep"
 nd_rus_naval_academy_upkeep_desc: "Maintenance costs for the naval academy: timber and naval supplies for training vessels, tools for shipwright instruction, and paper for navigation charts and curriculum."
 nd_rus_fur_post: "Fur Trading Post"
 nd_rus_fur_post_desc: "A frontier trading station where trappers bring pelts of sable, fox, and ermine to be collected, graded, and shipped to markets in Moscow and beyond."
 nd_rus_fur_post_upkeep: "Trading Post Upkeep"
 nd_rus_fur_post_upkeep_desc: "Maintenance of the frontier trading post: tools for trappers and repair work, lumber for the post structure, and salt for preserving pelts before shipment to market."
 nd_rus_vodka_distillery: "Vodka Distillery"
 nd_rus_vodka_distillery_desc: "A grain spirit distillery producing the distinctive Russian liquor that generates significant revenue through state-controlled monopoly sales."
 nd_rus_vodka_production: "Vodka Distilling"
 nd_rus_vodka_production_desc: "The distillation of wheat grain into high-proof spirits for domestic consumption and export."
 levy_nd_rus_cossack_cavalry: "Cossack Levy"
 levy_nd_rus_cossack_cavalry_desc: "Light cavalry raised from the Cossack frontier communities."
 levy_nd_rus_don_cossack: "Don Cossack Levy"
 levy_nd_rus_don_cossack_desc: "Elite cavalry raised from the Don Cossack Host."
 nd_rus_formed_tt: "Russia has been formed"
 nd_rus_path_a_tt: "Chose the #bold Third Rome Ascendant#! destiny"
 nd_rus_path_b_tt: "Chose the #bold Empire of the Steppe#! destiny"